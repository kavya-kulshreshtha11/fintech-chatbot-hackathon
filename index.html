<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Settlement Q&A Agent</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 20px; background:#0b0d12; color:#e8eaed;}
  h1 { font-size: 1.4rem; }
  .row { display:flex; gap:8px; margin: 16px 0; }
  input { flex:1; padding: 10px 12px; border-radius: 8px; border: 1px solid #333; background:#15181f; color:#e8eaed; }
  button { padding: 10px 18px; border-radius: 8px; border: none; background:#4f7cff; color:white; cursor:pointer; font-weight:600;}
  button:disabled { opacity:.5; cursor:not-allowed; }
  .card { background:#15181f; border:1px solid #262a33; border-radius:12px; padding:18px; margin-top:16px; }
  .badge { display:inline-block; padding:3px 10px; border-radius:999px; font-size:.75rem; font-weight:700; margin-bottom:10px;}
  .ok { background:#123d24; color:#4ade80; }
  .warn { background:#3d2a12; color:#facc15; }
  .err { background:#3d1212; color:#f87171; }
  .explanation { line-height:1.5; white-space: pre-wrap; }
  details { margin-top:12px; }
  pre { background:#0b0d12; padding:10px; border-radius:8px; overflow:auto; font-size:.75rem; }
  .hint { color:#8a8f98; font-size:.85rem; }
</style>
</head>
<body>
  <h1>💳 Settlement Q&amp;A Agent</h1>
  <p class="hint">Enter a transaction ID (pay_...) or order ID (order_...). Try: pay_Gz8x1000, pay_Gz8x1052, pay_Gz8x1042, pay_Gz8x1038, pay_Gz8x1001</p>
  <div class="row">
    <input id="q" placeholder="e.g. pay_Gz8x1000" />
    <button id="go">Ask</button>
  </div>
  <div id="result"></div>

<script>
  // ⚠️ EDIT THESE TWO LINES with your project's values
  const SUPABASE_FUNCTION_URL = "https://aldexbzpjdbizhvclfbo.functions.supabase.co/settlement-trace";
  const SUPABASE_ANON_KEY = "sb_publishable_EvuqW2SJOjLKQS-bBxO_ZQ_1qyLZx5S";

  const q = document.getElementById('q');
  const go = document.getElementById('go');
  const result = document.getElementById('result');

  async function ask() {
    const query = q.value.trim();
    if (!query) return;
    go.disabled = true;
    result.innerHTML = '<p class="hint">Tracing across gateway, bank, and ledger…</p>';

    try {
      const res = await fetch(SUPABASE_FUNCTION_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
        },
        body: JSON.stringify({ query })
      });
      const data = await res.json();

      const badgeClass = data.needs_human_review ? (data.status_code === 'NOT_FOUND' ? 'err' : 'warn') : 'ok';

      result.innerHTML = `
        <div class="card">
          <span class="badge ${badgeClass}">${data.status_code}</span>
          <div class="explanation">${data.explanation}</div>
          ${data.needs_human_review ? '<p class="hint">⚠️ Flagged for human review — the agent is not fully confident this is resolved.</p>' : ''}
          <details>
            <summary class="hint">Raw trace data</summary>
            <pre>${JSON.stringify(data.raw_trace, null, 2)}</pre>
          </details>
        </div>`;
    } catch (e) {
      result.innerHTML = `<p style="color:#f87171">Error: ${e}</p>`;
    } finally {
      go.disabled = false;
    }
  }

  go.addEventListener('click', ask);
  q.addEventListener('keydown', (e) => { if (e.key === 'Enter') ask(); });
</script>
</body>
</html>
